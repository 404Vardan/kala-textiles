<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%" role="img" aria-label="Kala — Textile Wholesale Management System">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1917" />
      <stop offset="65%" stop-color="#292524" />
      <stop offset="100%" stop-color="#1C1917" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C2410C" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <pattern id="weaveGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#44403C" stroke-width="0.6" stroke-opacity="0.35" />
      <circle cx="16" cy="16" r="1" fill="#EA580C" fill-opacity="0.2" />
    </pattern>
  </defs>

  <!-- Main Card Background -->
  <rect width="1200" height="320" rx="18" fill="url(#bgGrad)" />
  <rect width="1200" height="320" rx="18" fill="url(#weaveGrid)" />

  <!-- Top Terracotta Accent Bar -->
  <rect x="0" y="0" width="1200" height="6" rx="3" fill="url(#accentGrad)" />

  <!-- Decorative Geometric Textile Motif (Right Side) -->
  <g transform="translate(855, 36)" opacity="0.95">
    <!-- Outer Card Frame -->
    <rect x="0" y="0" width="290" height="248" rx="16" fill="#292524" stroke="#44403C" stroke-width="1.5" />
    <rect x="16" y="16" width="258" height="44" rx="8" fill="#1C1917" stroke="#44403C" stroke-width="1" />
    <rect x="28" y="28" width="20" height="20" rx="5" fill="#C2410C" />
    <text x="38" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#F8F7F4" text-anchor="middle">K</text>
    <text x="58" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#F8F7F4">DESIGN #4955</text>
    <text x="58" y="51" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#A8A29E">4 Pcs/Set • Pure Silk • QR Active</text>

    <!-- Location Stock Pills -->
    <rect x="16" y="74" width="123" height="68" rx="10" fill="#1C1917" stroke="#44403C" stroke-width="1" />
    <text x="28" y="94" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#A8A29E">GODOWN STOCK</text>
    <text x="28" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" fill="#38BDF8">140 Sets</text>
    <text x="28" y="133" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#78716C">560 Total Pcs</text>

    <rect x="151" y="74" width="123" height="68" rx="10" fill="#1C1917" stroke="#44403C" stroke-width="1" />
    <text x="163" y="94" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#A8A29E">SHOP FLOOR</text>
    <text x="163" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" fill="#34D399">48 Sets</text>
    <text x="163" y="133" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#78716C">192 Total Pcs</text>

    <!-- QR & Order Status Bar -->
    <rect x="16" y="156" width="258" height="74" rx="10" fill="#1C1917" stroke="#C2410C" stroke-width="1" stroke-opacity="0.6" />
    <!-- Mini QR Representation -->
    <g transform="translate(28, 168)">
      <rect width="50" height="50" rx="6" fill="#F8F7F4" />
      <rect x="6" y="6" width="12" height="12" fill="#1C1917" />
      <rect x="32" y="6" width="12" height="12" fill="#1C1917" />
      <rect x="6" y="32" width="12" height="12" fill="#1C1917" />
      <rect x="22" y="22" width="8" height="8" fill="#C2410C" />
      <rect x="34" y="34" width="10" height="10" fill="#1C1917" />
    </g>
    <text x="90" y="184" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#F8F7F4">One QR — Three Workflows</text>
    <text x="90" y="201" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#D6D3D1">• Public Catalog &amp; Media</text>
    <text x="90" y="216" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#FB923C">• Buyer Request &amp; Staff Scan</text>
  </g>

  <!-- Left Content Column -->
  <g transform="translate(56, 48)">
    <!-- Brand Badge -->
    <g>
      <rect x="0" y="0" width="52" height="52" rx="13" fill="#292524" stroke="#44403C" stroke-width="1.5" />
      <!-- Woven K Emblem -->
      <rect x="13" y="11" width="7.5" height="30" rx="2.5" fill="#F8F7F4" />
      <path d="M21 25L34 11H41L26.5 26L41 41H34L21 27Z" fill="url(#accentGrad)" />
      <rect x="35" y="23.5" width="5" height="5" rx="1" transform="rotate(45 37.5 26)" fill="#F8F7F4" />

      <rect x="66" y="11" width="305" height="30" rx="15" fill="#292524" stroke="#44403C" stroke-width="1" />
      <circle cx="82" cy="26" r="4" fill="#EA580C" />
      <text x="94" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#FDBA74">TEXTILE WHOLESALE MANAGEMENT SYSTEM</text>
    </g>

    <!-- Title & Subtitle -->
    <text x="0" y="106" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="900" letter-spacing="-1" fill="#F8F7F4">KALA</text>
    <circle cx="142" cy="92" r="5" fill="#EA580C" />
    <text x="0" y="140" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" fill="#D6D3D1">
      QR-powered design catalog, multi-location stock control, and wholesale order operations
    </text>

    <!-- Feature Pill Row -->
    <g transform="translate(0, 174)">
      <rect x="0" y="0" width="164" height="36" rx="8" fill="#292524" stroke="#44403C" stroke-width="1" />
      <text x="82" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#F8F7F4" text-anchor="middle">QR Product Catalog</text>

      <rect x="176" y="0" width="182" height="36" rx="8" fill="#292524" stroke="#44403C" stroke-width="1" />
      <text x="267" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#F8F7F4" text-anchor="middle">Godown &amp; Shop Stock</text>

      <rect x="370" y="0" width="182" height="36" rx="8" fill="#292524" stroke="#44403C" stroke-width="1" />
      <text x="461" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#F8F7F4" text-anchor="middle">Buyer Order Requests</text>

      <rect x="564" y="0" width="188" height="36" rx="8" fill="#292524" stroke="#44403C" stroke-width="1" />
      <text x="658" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#F8F7F4" text-anchor="middle">Multi-Tenant Supabase</text>
    </g>
  </g>
</svg>
