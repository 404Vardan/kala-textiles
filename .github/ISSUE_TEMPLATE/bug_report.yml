name: Bug Report
description: Report a defect in the public QR catalog, buyer order requests, admin portal, staff scanner, or database RPCs.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue in **Kala — Textile Wholesale Management System**. Please provide the details below so we can reproduce and resolve it quickly.

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      description: Which part of the system is affected?
      options:
        - Public QR Product Page (/:slug/p/:designNo)
        - Buyer Order Request Checkout (/:slug/order-request)
        - Owner Admin Portal (/admin — Dashboard, Products, Stock, Orders, Directories)
        - Staff Floor Scanner & Mobile Terminal (/staff)
        - PDF Order / QR Label Generation
        - Supabase Auth / RLS / Database RPCs
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what happened vs. what you expected.
      placeholder: Describe the issue...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Navigate to '/rangoli/p/4955'
        2. Select 3 sets and click 'Add to Order List'
        3. Open 'Review Order'
        4. Observe error...
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Device & Browser
      description: e.g. Android Chrome 134, Windows Edge, iOS Safari
      placeholder: "Android 14 / Chrome Mobile"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Console / RPC Error Output
      description: Paste any relevant browser console or Supabase RPC error messages (do not include secrets or tokens).
      render: shell
    validations:
      required: false

